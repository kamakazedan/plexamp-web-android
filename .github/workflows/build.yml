name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Each job gets only what it needs. Actions are pinned to the commits of the
# versions named beside them, and the runner to Ubuntu 24.04 (with Android's
# SDK on it).
permissions:
  contents: read

# One run at a time for each branch or tag; a pull request's older run is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests, lint and the APK, for every push and pull request. Nothing here
  # sees the release key: the APK is signed with a key made for this run, for
  # testing, so it installs only where the app isn't installed already.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The player the app saves, for the test that saves its files as the app does.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kamakazedan/plexamp-web
          path: plexamp-web
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check the Gradle wrapper is Gradle's own
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -

      - name: Check the version matches the changelog
        run: |
          app="$(sed -n 's/^val appVersion = "\([0-9.]*\)"$/\1/p' app/build.gradle.kts)"
          log="$(sed -n 's/^## \([0-9][0-9.]*\) .*/\1/p' CHANGELOG.md | head -n 1)"
          echo "app $app, changelog $log"
          [ -n "$app" ] && [ "$app" = "$log" ] || { echo "appVersion in app/build.gradle.kts must match the newest CHANGELOG.md entry"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$app" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $app"
            exit 1
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"

      # (Release builds are signed with Gradle's debug key, which is made for this run.)
      - name: Test and build
        env:
          PLEXAMP_WEB_DIR: ${{ github.workspace }}/plexamp-web/web
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleRelease

      - name: Name the APK
        run: |
          apk="plexamp-web-android-$VERSION-test.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          {
            echo "### $apk"
            echo
            echo "For testing: signed with a key made for this run, so it installs only where the app isn't installed already. Releases are signed with the release key."
            echo
            echo "SHA-256: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK=$apk" >> "$GITHUB_ENV"

      # The release job's signing (see release below), with keys made for this run:
      # one with an alias given, one without.
      - name: Check the release signing works
        shell: bash
        run: |
          export KEYSTORE="$RUNNER_TEMP/check.p12"
          KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          export KEYSTORE_PASSWORD
          keytool -genkeypair -keystore "$KEYSTORE" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
            -alias check -keyalg RSA -keysize 2048 -validity 1 -dname "CN=check" 2> /dev/null
          for alias in "" check; do
            KEY_ALIAS="$alias" .github/sign-apk.sh "$APK" "$RUNNER_TEMP/check.apk" > /dev/null
            rm -f "$RUNNER_TEMP"/check.apk*
          done
          rm -f "$KEYSTORE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plexamp-web-android-${{ env.VERSION }}-test
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Keep the reports where a check failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

  # A version tag (v0.1.0) publishes a release: the build's APK, signed with the
  # release key, its SHA-256, and its changelog entry. This job alone reads the
  # key, and runs none of the build's code (not Gradle, nor its plugins): the
  # Android SDK's apksigner signs the APK. Its secrets are best kept in the
  # "release" environment, which only v* tags may use (see README.md). Without
  # them, nothing is published.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Get the build's APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "plexamp-web-android-$version-test" --dir built
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "APK=plexamp-web-android-$version.apk" >> "$GITHUB_ENV"

      - name: Sign it with the release key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # (Best a variable: a secret's words are hidden wherever they're in the log,
          # and an alias is no secret. Not needed where the keystore has one key.)
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error title=Signing::No release key, so nothing was published: add its secrets (see README.md), then re-run this job."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$keystore")
          cert="$(KEYSTORE="$keystore" KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" KEY_PASSWORD="$ANDROID_KEY_PASSWORD" KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            .github/sign-apk.sh "built/plexamp-web-android-$VERSION-test.apk" "$APK")"
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      # Where the release was made on the Releases page (which also pushes its tag),
      # the APK is added to it, and its notes are kept unless it has none.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum "$APK" > "$APK.sha256"
          sha="$(cut -d' ' -f1 "$APK.sha256")"
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo
            echo "### Checking the APK"
            echo
            echo "- SHA-256: \`$sha\`"
            echo "- Signing certificate's SHA-256: \`$CERT_SHA256\` (\`apksigner verify --print-certs\` shows an APK's)"
          } >> notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
          {
            echo "### $APK"
            echo
            echo "SHA-256: \`$sha\`"
            echo
            echo "Signing certificate's SHA-256: \`$CERT_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"
